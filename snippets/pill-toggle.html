<style>.s{position:relative;width:56px;height:30px}.s input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.s span{position:absolute;inset:0;background:#c5cbd9;border-radius:99px;transition:.2s}.s span:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.s input:checked+span{background:#2f5bff}.s input:checked+span:after{left:29px}</style>
<label class="s"><input type="checkbox"><span></span></label>
