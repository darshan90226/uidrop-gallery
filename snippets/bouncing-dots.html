<style>.d{display:flex;gap:6px}.d i{width:12px;height:12px;border-radius:50%;background:#2f5bff;animation:b .6s infinite alternate}.d i:nth-child(2){animation-delay:.15s}.d i:nth-child(3){animation-delay:.3s}@keyframes b{to{transform:translateY(-12px);opacity:.4}}</style>
<div class="d"><i></i><i></i><i></i></div>
