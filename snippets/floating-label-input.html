<!--
title: Floating label input
author: @sana
category: Forms
-->
<style>.f{position:relative;font-family:system-ui}.f input{width:220px;padding:20px 12px 6px;border:1px solid #b8c0d4;border-radius:10px;font-size:16px}.f label{position:absolute;left:12px;top:14px;color:#5b667e;transition:.15s;pointer-events:none}.f input:focus+label,.f input:not(:placeholder-shown)+label{top:4px;font-size:11px;color:#2f5bff}</style>
<div class="f"><input placeholder=" " id="x"><label for="x">Email address</label></div>
